name: Check website
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check generate.mjs
          node --check src/app.js
          node --check build.mjs
          node --check server.mjs
      - name: Build website
        run: npm run build
      - name: Check generated files are committed
        run: git diff --exit-code -- src/index.html src/404.html src/_headers dist/
      - name: Check whitespace
        run: git diff --check
